# Builds and checks FraiTube on Windows and Linux, for x64 and ARM64, for every push to main and every pull request.
# A pushed version tag such as v0.8.0 also publishes a GitHub release with the installers and the AppImages.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Each machine packs FraiTube for its own processor.
        include:
          - name: Windows
            artifact: windows-x64
            os: windows-latest
            file: release/*-setup.exe
          - name: Windows ARM64
            artifact: windows-arm64
            os: windows-11-arm
            file: release/*-setup-arm64.exe
          - name: Linux
            artifact: linux-x64
            os: ubuntu-latest
            file: release/*-x86_64.AppImage
          - name: Linux ARM64
            artifact: linux-arm64
            os: ubuntu-24.04-arm
            file: release/*-aarch64.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # The builds are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: FraiTube-${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job needs only Node.js, so pnpm is not installed and its cache stays off.
          package-manager-cache: false
      - name: Check the version and write the release notes
        id: notes
        run: echo "version=$(node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # The x64 files go up first and the ARM64 files after them. FraiTube 0.9.7 and 0.9.8 take the first
      # file whose name fits their system, and on Linux the ARM64 AppImage's name fits too.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*-setup.exe assets/*-x86_64.AppImage --verify-tag --title "FraiTube ${{ steps.notes.outputs.version }}" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" assets/*-setup-arm64.exe assets/*-aarch64.AppImage
