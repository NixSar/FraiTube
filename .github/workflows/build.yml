# Builds and checks FraiTube on Windows and Linux for every push to main and every pull request.
# A pushed version tag such as v0.8.0 also publishes a GitHub release with the installer and the AppImage.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            file: release/*-setup.exe
          - name: Linux
            os: ubuntu-latest
            file: release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # The builds are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: FraiTube-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job needs only Node.js, so pnpm is not installed and its cache stays off.
          package-manager-cache: false
      - name: Check the version and write the release notes
        id: notes
        run: echo "version=$(node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "FraiTube ${{ steps.notes.outputs.version }}" --notes-file release-notes.md
