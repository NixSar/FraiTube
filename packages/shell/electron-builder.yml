# Packs the built app in out/ into the Windows installer and the Linux AppImage, for the processor
# scripts/package.mjs names. The names here are the x64 files'; that script names the ARM64 files.
appId: fraitube
productName: FraiTube
copyright: Copyright (C) 2026 NixSar
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
electronDist: node_modules/electron/dist
publish: null
toolsets:
  appimage: 1.0.3
win:
  target: nsis
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  target: AppImage
  executableName: fraitube
  category: AudioVideo
  synopsis: A YouTube app that needs no Google account.
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
