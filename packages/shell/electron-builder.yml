# Packs the built app in out/ into the Windows installer and the Linux AppImage.
appId: fraitube
productName: FraiTube
copyright: Copyright (C) 2026 NixSar
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
electronDist: node_modules/electron/dist
publish: null
toolsets:
  appimage: 1.0.3
win:
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
  executableName: fraitube
  category: AudioVideo
  synopsis: A desktop YouTube app that needs no Google account.
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
